<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melix Dashboard — Logging In</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card" id="statusCard">
      <div class="spinner"></div>
      <p style="color: var(--text-secondary); margin-top: 16px;">Completing login...</p>
    </div>
  </div>

  <script src="dashboard.js"></script>
  <script>
    (function() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);

      const token = params.get('token');

      const card = document.getElementById('statusCard');

      if (token) {
        Auth.setToken(token);
        card.innerHTML = `
          <div style="color: var(--success); font-size: 1.5rem; margin-bottom: 8px;">&#10003;</div>
          <p style="color: var(--text-secondary);">Login successful! Redirecting...</p>
        `;
        setTimeout(() => { window.location.href = 'select.html'; }, 800);
      } else {
        card.innerHTML = `
          <div style="color: var(--danger); font-size: 1.5rem; margin-bottom: 8px;">&#10007;</div>
          <p style="color: var(--danger);">Login failed — no token received.</p>
          <a href="index.html" style="display: inline-block; margin-top: 16px; color: var(--accent);">Try again</a>
        `;
      }
    })();
  </script>
</body>
</html>
